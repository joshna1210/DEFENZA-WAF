# Optional: put this in front of everything in production for TLS
# termination, instead of exposing the FastAPI proxy directly.
events {}

http {
    upstream waf_proxy {
        server proxy:9000;
    }

    upstream backend_api {
        server backend:8000;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        location / {
            proxy_pass http://waf_proxy;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
