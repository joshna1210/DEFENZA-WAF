version: "3.9"

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017
    depends_on:
      - mongodb

  proxy:
    build:
      context: .
      dockerfile: infrastructure/docker/proxy.Dockerfile
    ports:
      - "9000:9000"
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  # Optional: uncomment once you want a local chain for BLOCKCHAIN_ENABLED=true
  # ganache:
  #   image: trufflesuite/ganache:latest
  #   ports:
  #     - "8545:8545"
  #   command: --wallet.deterministic

volumes:
  mongo_data:
