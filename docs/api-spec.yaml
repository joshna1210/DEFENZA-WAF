openapi: 3.0.0
info:
  title: AI-WAF Blockchain Backend API
  version: 0.1.0
  description: >
    Full interactive docs are auto-generated by FastAPI at /docs once the
    backend is running. This file lists the route groups for quick reference.
paths:
  /api/auth/register:
    post: { summary: Register a new user (admin | soc_analyst role) }
  /api/auth/login:
    post: { summary: Log in, returns a JWT }
  /api/traffic/ingest:
    post: { summary: "Internal: proxy posts every request/response here" }
  /api/traffic:
    get: { summary: List recent traffic logs (paginated, filterable) }
  /api/traffic/{traffic_id}:
    get: { summary: Get a single traffic log with full detail }
  /api/analysis/test:
    post: { summary: Run the analysis pipeline on an ad-hoc payload }
  /api/reports/summary:
    get: { summary: Aggregate traffic stats over a time window }
  /api/reports/ips:
    get: { summary: Per-IP activity summary }
  /api/vulnerability/scan:
    post: { summary: Generate a vulnerability findings report (admin only) }
  /api/vulnerability/reports:
    get: { summary: List past vulnerability reports }
  /api/blockchain/batches:
    get: { summary: List blockchain audit batches }
  /api/blockchain/run-batch-now:
    post: { summary: Force an immediate batch job run (admin only) }
  /api/alerts:
    get: { summary: List high/critical risk alerts }
